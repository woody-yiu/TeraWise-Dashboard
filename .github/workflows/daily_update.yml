name: Daily Dashboard Update (Fixed)

on:
  schedule:
    # Taiwan Time (UTC+8): 08:38
    - cron: '38 0 * * *'
    # Taiwan Time (UTC+8): 14:47, 16:47
    - cron: '47 6,8 * * *'
    # Taiwan Time (UTC+8): 17:53
    - cron: '53 9 * * *'
    # Taiwan Time (UTC+8): 19:13
    - cron: '13 11 * * *'
  workflow_dispatch:
    inputs:
      verify_new_noble:
        description: "Verify private holdings without sending Telegram"
        type: boolean
        default: false
      resend_signal_date:
        description: "Resend corrected report once for this signal date (YYYY-MM-DD)"
        type: string
        default: ""
      resend_message_sha256:
        description: "SHA256 of the successfully validated corrected report"
        type: string
        default: ""

permissions:
  contents: write

# 防止排程延遲或手動執行與排程重疊，確保通知鎖依序更新。
concurrency:
  group: daily-dashboard-update
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify New Noble Private Holdings
        if: ${{ inputs.verify_new_noble == true }}
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: "VALIDATION_ONLY_NO_DELIVERY"
          TELEGRAM_CHAT_ID: "VALIDATION_ONLY_NO_DELIVERY"
          VALIDATE_NOTIFICATION_ONLY: "1"
        run: python update_daily.py

      - name: Run Update Script
        if: ${{ inputs.verify_new_noble != true }}
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_RESEND_SIGNAL_DATE: ${{ inputs.resend_signal_date }}
          TELEGRAM_EXPECTED_MESSAGE_SHA256: ${{ inputs.resend_message_sha256 }}
        run: python update_daily.py

      - name: Commit and Push Changes
        if: ${{ inputs.verify_new_noble != true }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          touch .last_notify_date
          git add index.html .last_notify_date historical_signals.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto Update Dashboard: $(date +'%Y-%m-%d')"
            git push
          fi
