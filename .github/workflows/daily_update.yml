name: Daily Dashboard Update (Fixed)

on:
  schedule:
    # Taiwan Time (UTC+8): 15:35, 16:35. Backup for the independent scheduler.
    - cron: '35 7,8 * * *'
    # Taiwan Time (UTC+8): 16:00
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      verify_scheduler_only:
        description: "Verify the scheduler trigger without updating data or sending notifications"
        type: boolean
        default: false
      verify_new_noble:
        description: "Verify private holdings without sending Telegram"
        type: boolean
        default: false
      resend_signal_date:
        description: "Resend corrected report once for this signal date (YYYY-MM-DD)"
        type: string
        default: ""
      resend_message_sha256:
        description: "SHA256 of the successfully validated corrected report"
        type: string
        default: ""

permissions:
  contents: write

# 防止排程延遲或手動執行與排程重疊，確保通知鎖依序更新。
concurrency:
  group: daily-dashboard-update
  cancel-in-progress: false

jobs:
  verify-scheduler:
    if: ${{ inputs.verify_scheduler_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Verify scheduler trigger only
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          TZ=Asia/Taipei date '+Scheduler verified: %Y-%m-%d %H:%M:%S %Z'
          printf 'Trigger: %s\n' "$EVENT_NAME"

  update-dashboard:
    if: ${{ inputs.verify_scheduler_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify New Noble Private Holdings
        if: ${{ inputs.verify_new_noble == true }}
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: "VALIDATION_ONLY_NO_DELIVERY"
          TELEGRAM_CHAT_ID: "VALIDATION_ONLY_NO_DELIVERY"
          VALIDATE_NOTIFICATION_ONLY: "1"
        run: python -u update_daily.py

      - name: Run Update Script
        if: ${{ inputs.verify_new_noble != true }}
        env:
          FINLAB_TOKEN: ${{ secrets.FINLAB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_RESEND_SIGNAL_DATE: ${{ inputs.resend_signal_date }}
          TELEGRAM_EXPECTED_MESSAGE_SHA256: ${{ inputs.resend_message_sha256 }}
        run: |
          echo "PUBLISH_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%S+00:00')" >> "$GITHUB_ENV"
          python -u update_daily.py

      - name: Verify published dashboard
        if: ${{ inputs.verify_new_noble != true }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          import firebase_admin
          from firebase_admin import credentials, firestore

          firebase_admin.initialize_app(credentials.Certificate(json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])))
          snapshot = firestore.client().collection("quant_fund").document("dashboard_data").get(timeout=30)
          if not snapshot.exists:
              raise SystemExit("Dashboard publication failed: document missing")
          payload = snapshot.to_dict()
          published = payload["summary"]["last_update"]
          published_at = datetime.strptime(published, "%Y-%m-%d %H:%M:%S").replace(tzinfo=timezone(timedelta(hours=8)))
          started_at = datetime.fromisoformat(os.environ["PUBLISH_STARTED_AT"])
          if published_at < started_at:
              raise SystemExit("Dashboard publication failed: stored data predates this run")
          history = payload.get("history", [])
          if not history:
              raise SystemExit("Dashboard publication failed: price history missing")
          signal_date = history[-1]["date"]
          print(f"PUBLISH_VERIFIED published_at={published} data_date={signal_date}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Published (Asia/Taipei): {published}\n\nData date: {signal_date}\n")
          PY

      - name: Commit and Push Changes
        if: ${{ inputs.verify_new_noble != true }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          touch .last_notify_date
          git add index.html .last_notify_date historical_signals.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto Update Dashboard: $(date +'%Y-%m-%d')"
            git push
          fi
